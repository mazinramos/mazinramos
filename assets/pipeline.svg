<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" role="img" aria-label="Build pipeline: idea, design, build, test, ship, improve" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .n{fill:#0A0A0B;stroke:#3B3730;stroke-width:2;animation:n 10s linear infinite}
    @keyframes n{0%,6%{fill:#C8A96A;stroke:#C8A96A}18%,100%{fill:#0A0A0B;stroke:#3B3730}}
    .t{fill:#8A8579;animation:t 10s linear infinite}
    @keyframes t{0%,6%{fill:#F4EFE6}18%,100%{fill:#8A8579}}
  </style>
  <rect x="0.5" y="0.5" width="999" height="219" rx="16" fill="#0A0A0B" stroke="#F4EFE6" stroke-opacity="0.12"/>
  <line x1="100" y1="100" x2="900" y2="100" stroke="#F4EFE6" stroke-opacity="0.16" stroke-width="2"/>

  <g class="mono" font-size="11" fill="#3B3730" letter-spacing="3" text-anchor="middle">
    <text x="100" y="60">01</text><text x="260" y="60">02</text><text x="420" y="60">03</text>
    <text x="580" y="60">04</text><text x="740" y="60">05</text><text x="900" y="60">06</text>
  </g>

  <circle class="n" cx="100" cy="100" r="9" style="animation-delay:0s"/>
  <circle class="n" cx="260" cy="100" r="9" style="animation-delay:2s"/>
  <circle class="n" cx="420" cy="100" r="9" style="animation-delay:4s"/>
  <circle class="n" cx="580" cy="100" r="9" style="animation-delay:6s"/>
  <circle class="n" cx="740" cy="100" r="9" style="animation-delay:8s"/>
  <circle class="n" cx="900" cy="100" r="9" style="animation-delay:10s"/>

  <circle r="4" cx="0" cy="100" fill="#F4EFE6">
    <animateMotion dur="10s" repeatCount="indefinite" path="M100 0 H900"/>
  </circle>

  <g class="mono" font-size="15" font-weight="700" letter-spacing="3" text-anchor="middle">
    <text class="t" x="100" y="140" style="animation-delay:0s">IDEA</text>
    <text class="t" x="260" y="140" style="animation-delay:2s">DESIGN</text>
    <text class="t" x="420" y="140" style="animation-delay:4s">BUILD</text>
    <text class="t" x="580" y="140" style="animation-delay:6s">TEST</text>
    <text class="t" x="740" y="140" style="animation-delay:8s">SHIP</text>
    <text class="t" x="900" y="140" style="animation-delay:10s">IMPROVE</text>
  </g>
  <g class="mono" font-size="11" fill="#6E695E" letter-spacing="1" text-anchor="middle">
    <text x="100" y="164">define the problem</text>
    <text x="260" y="164">structure &amp; UX</text>
    <text x="420" y="164">full-stack code</text>
    <text x="580" y="164">break it first</text>
    <text x="740" y="164">put it online</text>
    <text x="900" y="164">learn &amp; iterate</text>
  </g>
  <text class="mono" x="500" y="200" font-size="11" fill="#3B3730" letter-spacing="4" text-anchor="middle">↺  THE LOOP NEVER CLOSES</text>
</svg>
