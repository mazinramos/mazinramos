<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" role="img" aria-label="Let's build something useful." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4EFE6"/>
      <stop offset="1" stop-color="#9C9484"/>
    </linearGradient>
  </defs>
  <style>
    .sans{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .draw{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.2s cubic-bezier(.6,0,.2,1) .4s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise 1s ease-out .1s forwards}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .glow{animation:glow 6s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
  </style>
  <rect x="0.5" y="0.5" width="999" height="239" rx="16" fill="#0A0A0B" stroke="#F4EFE6" stroke-opacity="0.12"/>
  <ellipse class="glow" cx="500" cy="120" rx="360" ry="70" fill="#C8A96A" opacity="0.05"/>
  <text class="mono" x="500" y="52" font-size="13" fill="#C8A96A" letter-spacing="6" text-anchor="middle">&lt; NEXT STEP /&gt;</text>
  <g class="rise">
    <text class="sans" x="500" y="118" font-size="52" font-weight="800" fill="url(#g)" letter-spacing="3" text-anchor="middle">LET'S BUILD</text>
    <text class="sans" x="500" y="176" font-size="52" font-weight="800" fill="#C8A96A" letter-spacing="3" text-anchor="middle">SOMETHING USEFUL.</text>
  </g>
  <line class="draw" x1="290" y1="203" x2="710" y2="203" stroke="#C8A96A" stroke-width="2" stroke-linecap="round"/>
</svg>
