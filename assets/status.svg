<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="System status: mazinramos, Full-Stack Developer, focus on digital products, currently building" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8A96A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C8A96A"/>
      <stop offset="1" stop-color="#C8A96A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .sans{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
    .lab{font-size:11px;fill:#8A8579;letter-spacing:3px}
    .val{font-size:22px;font-weight:600;fill:#F4EFE6}
    .cell{fill:#101113;stroke:#F4EFE6;stroke-opacity:.09}
    .p{animation:p 2.8s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
    .sweep{animation:sweep 7s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1000px)}}
    .c{opacity:0;animation:c .7s ease-out forwards}
    @keyframes c{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  </style>
  <rect x="0.5" y="0.5" width="999" height="299" rx="16" fill="#0A0A0B" stroke="#F4EFE6" stroke-opacity="0.12"/>

  <text class="mono" x="40" y="50" font-size="13" fill="#C8A96A" letter-spacing="4">MAZEN.SYS</text>
  <text class="mono" x="150" y="50" font-size="13" fill="#3B3730" letter-spacing="4">//  IDENTITY &amp; STATUS</text>
  <circle class="p" cx="944" cy="45" r="4.5" fill="#C8A96A"/>
  <text class="mono" x="930" y="50" font-size="12" fill="#8A8579" letter-spacing="3" text-anchor="end">LIVE</text>

  <g class="c" style="animation-delay:.1s">
    <rect class="cell" x="40" y="80" width="290" height="82" rx="10"/>
    <text class="mono lab" x="60" y="108">SYSTEM</text>
    <text class="sans val" x="60" y="142">mazinramos</text>
  </g>
  <g class="c" style="animation-delay:.25s">
    <rect class="cell" x="355" y="80" width="290" height="82" rx="10"/>
    <text class="mono lab" x="375" y="108">ROLE</text>
    <text class="sans val" x="375" y="142">Full-Stack Developer</text>
  </g>
  <g class="c" style="animation-delay:.4s">
    <rect class="cell" x="670" y="80" width="290" height="82" rx="10"/>
    <text class="mono lab" x="690" y="108">FOCUS</text>
    <text class="sans val" x="690" y="142">Digital Products</text>
  </g>
  <g class="c" style="animation-delay:.55s">
    <rect class="cell" x="40" y="180" width="290" height="82" rx="10"/>
    <text class="mono lab" x="60" y="208">EDUCATION</text>
    <text class="sans val" x="60" y="242">Computer Science</text>
  </g>
  <g class="c" style="animation-delay:.7s">
    <rect class="cell" x="355" y="180" width="290" height="82" rx="10"/>
    <text class="mono lab" x="375" y="208">CORE STACK</text>
    <text class="sans val" x="375" y="242">React · Next.js · Firebase</text>
  </g>
  <g class="c" style="animation-delay:.85s">
    <rect class="cell" x="670" y="180" width="290" height="82" rx="10" stroke="#C8A96A" stroke-opacity=".5"/>
    <text class="mono lab" x="690" y="208">STATUS</text>
    <circle class="p" cx="697" cy="235" r="5" fill="#C8A96A"/>
    <text class="sans val" x="713" y="242" style="fill:#C8A96A">BUILDING</text>
  </g>

  <clipPath id="cl"><rect x="40" y="280" width="920" height="2"/></clipPath>
  <line x1="40" y1="281" x2="960" y2="281" stroke="#F4EFE6" stroke-opacity="0.08"/>
  <g clip-path="url(#cl)"><rect class="sweep" x="0" y="279" width="300" height="4" fill="url(#bar)"/></g>
</svg>
