<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" role="img" aria-label="Mazen Mohamed — Full-Stack Developer, Digital Product Builder, Computer Science Student" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#15120D"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F4EFE6" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8A96A" stop-opacity="0"/>
      <stop offset="1" stop-color="#C8A96A" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4EFE6"/>
      <stop offset="1" stop-color="#C8A96A"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="400" rx="18"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .sans{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
    .scan{animation:scan 12s linear infinite}
    @keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(420px)}}
    .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
    .rise{opacity:0;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) .2s forwards}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .role{opacity:0;animation:role 9s ease-in-out infinite}
    @keyframes role{0%{opacity:0}6%{opacity:1}30%{opacity:1}36%{opacity:0}100%{opacity:0}}
    .node{fill:#0A0A0B;stroke:#3B3730;stroke-width:2;animation:node 5s linear infinite}
    @keyframes node{0%,10%{fill:#C8A96A;stroke:#C8A96A}22%,100%{fill:#0A0A0B;stroke:#3B3730}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="400" fill="url(#bg)"/>
    <rect width="1000" height="400" fill="url(#grid)"/>
    <rect class="scan" width="1000" height="80" fill="url(#scan)"/>
    <ellipse cx="500" cy="200" rx="420" ry="120" fill="#C8A96A" opacity="0.035"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="399" rx="18" fill="none" stroke="#F4EFE6" stroke-opacity="0.1"/>

  <g stroke="#C8A96A" stroke-opacity="0.7" stroke-width="1.5" fill="none">
    <path d="M22 46V22H46"/><path d="M954 22H978V46"/><path d="M22 354V378H46"/><path d="M978 354V378H954"/>
  </g>
  <!-- top bar -->
  <circle class="pulse" cx="64" cy="44" r="4.5" fill="#C8A96A"/>
  <text class="mono" x="80" y="48" font-size="13" fill="#8A8579" letter-spacing="2">ONLINE · BUILDING</text>
  <text class="mono" x="936" y="48" font-size="13" fill="#8A8579" letter-spacing="2" text-anchor="end">GITHUB.COM/MAZINRAMOS</text>
  <line x1="64" y1="68" x2="936" y2="68" stroke="#F4EFE6" stroke-opacity="0.08"/>

  <!-- name -->
  <g class="rise">
    <text class="mono" x="500" y="128" font-size="14" fill="#C8A96A" letter-spacing="6" text-anchor="middle">&lt; DIGITAL PRODUCTS /&gt;</text>
    <text class="sans" x="500" y="205" font-size="78" font-weight="800" fill="url(#name)" letter-spacing="5" text-anchor="middle">MAZEN MOHAMED</text>
  </g>

  <!-- rotating roles -->
  <g class="mono" font-size="20" fill="#F4EFE6" letter-spacing="7" text-anchor="middle">
    <text class="role" x="500" y="252" style="animation-delay:0s">FULL-STACK DEVELOPER</text>
    <text class="role" x="500" y="252" style="animation-delay:3s">DIGITAL PRODUCT BUILDER</text>
    <text class="role" x="500" y="252" style="animation-delay:6s">COMPUTER SCIENCE STUDENT</text>
  </g>

  <!-- pipeline: code -> product -> system -> data -->
  <line x1="250" y1="330" x2="750" y2="330" stroke="#F4EFE6" stroke-opacity="0.18" stroke-width="2"/>
  <circle class="node" cx="250" cy="330" r="7" style="animation-delay:0s"/>
  <circle class="node" cx="417" cy="330" r="7" style="animation-delay:1.25s"/>
  <circle class="node" cx="583" cy="330" r="7" style="animation-delay:2.5s"/>
  <circle class="node" cx="750" cy="330" r="7" style="animation-delay:3.75s"/>
  <circle r="3.5" cy="330" cx="0" fill="#F4EFE6">
    <animateMotion dur="5s" repeatCount="indefinite" path="M250 0 H750"/>
  </circle>
  <g class="mono" font-size="12" fill="#8A8579" letter-spacing="3" text-anchor="middle">
    <text x="250" y="362">CODE</text>
    <text x="417" y="362">PRODUCT</text>
    <text x="583" y="362">SYSTEM</text>
    <text x="750" y="362">DATA</text>
  </g>
</svg>
